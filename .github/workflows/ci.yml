name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          # The race detector needs cgo and a C toolchain, which is
          # unreliable on Windows runners.
          race=-race
          if [ "$RUNNER_OS" = "Windows" ]; then race=; fi
          # On failure, repeat the key lines as annotations so they show
          # up in the run summary.
          go test ./... $race 2>&1 | tee test.log || {
            grep -E '^(--- FAIL|FAIL|panic:|fatal error)|WARNING: DATA RACE|ThreadSanitizer|dyld|_test\.go:[0-9]+:' test.log \
              | head -30 | sed 's/^/::error::/'
            exit 1
          }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
